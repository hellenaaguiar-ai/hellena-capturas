# Copie este arquivo para config.yaml e ajuste os caminhos para a sua maquina.
# config.yaml NAO deve ser commitado (contem caminhos pessoais).

# Pasta local sincronizada pelo Google Drive Desktop onde o Atalho do iPhone
# salva os audios (ver docs/ios-shortcut-setup.md).
inbox_dir: "G:\\Meu Drive\\VoiceCaptures\\inbox"

# Exceção deliberada: somente os áudios salvos nesta pasta são enviados à
# OpenAI para transcrição rápida com separação por falante. As demais capturas
# continuam usando Whisper local. A chave vem de OPENAI_API_KEY no ambiente.
meeting_inbox_dir: "C:\\Users\\Hellena\\iCloudDrive\\VoiceCaptures\\Reuniões"
meeting_transcription_model: "gpt-4o-transcribe-diarize"

# Amostra limpa de 2 a 10 segundos, com apenas a voz da Hellena. Quando a API
# não reconhecer com segurança, mantém A/B; o sistema não força identidade.
speaker_reference_path: "C:\\Users\\Hellena\\iCloudDrive\\VoiceCaptures\\Referencias\\Hellena.m4a"
known_speaker_name: "Hellena"

# Pasta dentro do seu vault do Obsidian onde as notas processadas vao aparecer.
vault_inbox_dir: "C:\\Universo Hellena\\Hellena's Second Brain\\Inbox\\Ideias"

# Biblioteca plana do vault. Capturas espontaneas sobre um livro so vao para
# essa pasta quando o titulo estiver explicito e inequivoco na propria fala.
# Se omitido, usa "📚 Livros" na raiz do mesmo vault de vault_inbox_dir.
vault_books_dir: "C:\\Users\\Hellena\\ObsidianVault\\📚 Livros"

# Onde o pipeline guarda estado, audio arquivado e transcricoes brutas.
# Pode ser relativo (fica dentro do repositorio) ou absoluto.
data_dir: "data"

# Tamanho do modelo Whisper local: tiny, base, small, medium, large-v3.
# "small" e um bom equilibrio entre velocidade e qualidade em CPU comum.
whisper_model: "small"
whisper_language: "pt"

# Opcional: nomes proprios, termos em ingles e palavras que o Whisper erra
# com frequencia (ex: seu nome, nomes de empresas/pessoas que voce cita
# bastante). Nao e uma lista de substituicao automatica - e um "aviso"
# passado ao modelo antes de ouvir o audio, que reduz bastante o erro de
# grafia nesses termos especificos (nao cria nem inventa palavras que nao
# foram ditas). Escreva como uma frase normal, com os termos exatamente
# como devem aparecer:
whisper_initial_prompt: "Hellena, We Founders, Ravi, Yá."

# Modelo da Claude API usado para sintese/classificacao (so texto e enviado).
anthropic_model: "claude-sonnet-5"

# Depois de quantos dias um audio ja processado com sucesso pode ser apagado
# por "python -m voice_capture.cleanup" (comando manual, nao automatico).
audio_retention_days: 30
